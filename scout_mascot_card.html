<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Mascot Card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fffbf7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Arial", sans-serif;
      }

      .card {
        background: #24211d;
        padding: 50px 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      /* Background glow effects */
      .card::before {
        content: "";
        position: absolute;
        top: -60px;
        left: -60px;
        width: 220px;
        height: 220px;
        background: radial-gradient(
          circle,
          rgba(192, 57, 47, 0.35) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .card::after {
        content: "";
        position: absolute;
        bottom: 20px;
        right: -40px;
        width: 180px;
        height: 180px;
        background: radial-gradient(
          circle,
          rgba(224, 161, 60, 0.14) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .card-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        position: relative;
        z-index: 1;
      }

      .logo {
        font-family: "Arial Black", sans-serif;
        font-weight: 900;
        font-size: 2rem;
        letter-spacing: 0.15em;
        color: white;
      }

      .tagline {
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
        margin-top: -1rem;
      }

      .ready-label {
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.2);
        margin-top: 0.5rem;
      }

      /* Antenna blink */
      .antenna-blink {
        animation: blink 3s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 85%, 100% {
          opacity: 1;
        }
        90%, 95% {
          opacity: 0.2;
        }
      }

      /* Car hover */
      .car-body {
        animation: hover 2.5s ease-in-out infinite;
      }

      @keyframes hover {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      /* Wheel spin */
      .wheel-left {
        animation: spin 3s linear infinite;
        transform-origin: 50px 108px;
      }

      .wheel-right {
        animation: spin 3s linear infinite;
        transform-origin: 110px 108px;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Eye glance */
      .eye-left, .eye-right {
        animation: eyeMove 4s ease-in-out infinite;
      }

      @keyframes eyeMove {
        0%, 40%, 100% {
          transform: translateX(0);
        }
        50%, 90% {
          transform: translateX(1px);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-content">
        <svg
          width="160"
          height="140"
          viewBox="0 0 160 140"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- Antenna -->
          <g class="antenna-blink">
            <line
              x1="80"
              y1="18"
              x2="80"
              y2="32"
              stroke="rgba(255,255,255,0.5)"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="80" cy="14" r="5" fill="#e0a13c" />
            <circle cx="80" cy="14" r="3" fill="white" opacity="0.6" />
          </g>

          <!-- Car body hover group -->
          <g class="car-body">
            <!-- Roof -->
            <rect x="46" y="32" width="68" height="34" rx="10" fill="#c0392f" />
            <!-- Windshield -->
            <rect
              x="53"
              y="37"
              width="54"
              height="24"
              rx="6"
              fill="#6e211c"
              opacity="0.8"
            />

            <!-- Eyes -->
            <g class="eye-left">
              <rect
                x="58"
                y="42"
                width="18"
                height="13"
                rx="4"
                fill="#c0392f"
              />
              <rect x="60" y="44" width="14" height="9" rx="3" fill="white" />
              <circle cx="67" cy="48" r="3.5" fill="#6e211c" />
              <circle cx="68.5" cy="46.5" r="1" fill="white" />
            </g>
            <g class="eye-right">
              <rect
                x="84"
                y="42"
                width="18"
                height="13"
                rx="4"
                fill="#c0392f"
              />
              <rect x="86" y="44" width="14" height="9" rx="3" fill="white" />
              <circle cx="93" cy="48" r="3.5" fill="#6e211c" />
              <circle cx="94.5" cy="46.5" r="1" fill="white" />
            </g>

            <!-- Main body -->
            <rect
              x="28"
              y="62"
              width="104"
              height="42"
              rx="10"
              fill="#c0392f"
            />

            <!-- Green stripe -->
            <rect
              x="28"
              y="82"
              width="104"
              height="6"
              fill="#e0a13c"
              opacity="0.8"
            />

            <!-- Headlights -->
            <rect
              x="30"
              y="66"
              width="16"
              height="10"
              rx="3"
              fill="#e0a13c"
              opacity="0.9"
            />
            <rect
              x="114"
              y="66"
              width="16"
              height="10"
              rx="3"
              fill="#e0a13c"
              opacity="0.9"
            />

            <!-- Grille -->
            <rect
              x="66"
              y="88"
              width="28"
              height="8"
              rx="4"
              fill="#6e211c"
              opacity="0.6"
            />
            <line
              x1="72"
              y1="88"
              x2="72"
              y2="96"
              stroke="#c0392f"
              stroke-width="1.5"
            />
            <line
              x1="80"
              y1="88"
              x2="80"
              y2="96"
              stroke="#c0392f"
              stroke-width="1.5"
            />
            <line
              x1="88"
              y1="88"
              x2="88"
              y2="96"
              stroke="#c0392f"
              stroke-width="1.5"
            />

            <!-- Sensor dome -->
            <ellipse cx="80" cy="32" rx="12" ry="6" fill="#6e211c" />
            <ellipse
              cx="80"
              cy="32"
              rx="8"
              ry="4"
              fill="#c0392f"
              opacity="0.7"
            />

            <!-- Wheel wells -->
            <rect
              x="28"
              y="96"
              width="104"
              height="12"
              rx="0"
              fill="#6e211c"
              opacity="0.4"
            />
          </g>

          <!-- Wheels -->
          <g class="wheel-left">
            <circle
              cx="50"
              cy="108"
              r="14"
              fill="#24211d"
              stroke="rgba(255,255,255,0.15)"
              stroke-width="2"
            />
            <circle cx="50" cy="108" r="8" fill="#c0392f" opacity="0.6" />
            <circle cx="50" cy="108" r="3" fill="white" opacity="0.4" />
            <line
              x1="50"
              y1="95"
              x2="50"
              y2="121"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="1.5"
            />
            <line
              x1="37"
              y1="108"
              x2="63"
              y2="108"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="1.5"
            />
          </g>

          <g class="wheel-right">
            <circle
              cx="110"
              cy="108"
              r="14"
              fill="#24211d"
              stroke="rgba(255,255,255,0.15)"
              stroke-width="2"
            />
            <circle cx="110" cy="108" r="8" fill="#c0392f" opacity="0.6" />
            <circle cx="110" cy="108" r="3" fill="white" opacity="0.4" />
            <line
              x1="110"
              y1="95"
              x2="110"
              y2="121"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="1.5"
            />
            <line
              x1="97"
              y1="108"
              x2="123"
              y2="108"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="1.5"
            />
          </g>

          <!-- Ground shadow -->
          <ellipse cx="80" cy="126" rx="52" ry="5" fill="rgba(0,0,0,0.25)" />
        </svg>

        <div class="ready-label">Scout is ready</div>
      </div>
    </div>
  </body>
</html>
