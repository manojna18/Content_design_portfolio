<title>Portrait</title>
<style>

  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #photo { z-index: 1; }
  #paint { z-index: 2; }
  .hint {
    position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    font-family: "Public Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.85); text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    z-index: 6; transition: opacity 0.5s ease; pointer-events: none;
  }
  .hint.hidden { opacity: 0; }
</style>

  // Build ordered brush strokes covering the whole canvas in diagonal sweeps.
  var strokes = [];
  (function build() {
    var angle = -0.32, rowH = 30, stepX = 38;
    for (var y = -10; y < H + 30; y += rowH) {
      var ltr = ((y / rowH) | 0) % 2 === 0;
      var xs = [];
      for (var x = -20; x < W + 30; x += stepX) xs.push(x);
      if (!ltr) xs.reverse();
      for (var k = 0; k < xs.length; k++) {
        strokes.push({ x: xs[k] + (Math.random()-0.5)*14, y: y + (Math.random()-0.5)*14, a: angle + (Math.random()-0.5)*0.25 });
      }
    }
  })();

  // Stamp a brush mark onto the MASK. erase=true removes (reveals photo),
  // erase=false adds the mark back (restores painting).
  function stampMask(s, erase) {
    mctx.save();
    mctx.globalCompositeOperation = erase ? "destination-out" : "source-over";
    mctx.translate(s.x, s.y);
    mctx.rotate(s.a);
    var len = 52, wid = 20, dabs = 7;
    for (var i = 0; i < dabs; i++) {
      var t = (i / (dabs - 1)) - 0.5;
      var cx = t * len;
      var taper = 1 - Math.abs(t) * 0.85;
      var rx = wid * 0.55, ry = wid * taper;
      var grad = mctx.createRadialGradient(cx, 0, 0, cx, 0, Math.max(rx, ry));
      var c = erase ? "0,0,0" : "255,255,255";
      grad.addColorStop(0, "rgba("+c+",1)");
      grad.addColorStop(0.72, "rgba("+c+",1)");
      grad.addColorStop(1, "rgba("+c+",0)");
      mctx.fillStyle = grad;
      mctx.beginPath();
      mctx.ellipse(cx, 0, rx, ry, 0, 0, Math.PI*2);
      mctx.fill();
    }
    mctx.restore();
  }

  // Composite painting through the mask onto the visible paint canvas.
  function composite() {
    actx.clearRect(0, 0, W, H);
    actx.drawImage(srcCanvas, 0, 0);
    actx.globalCompositeOperation = "destination-in";
    actx.drawImage(maskCanvas, 0, 0);
    actx.globalCompositeOperation = "source-over";
  }

  var progress = 0, direction = 0, animating = false, hintHidden = false;
  var STEP = 5;

  function tick() {
    if (!ready) { requestAnimationFrame(tick); return; }
    var moved = false;
    for (var n = 0; n < STEP; n++) {
      if (direction > 0 && progress < strokes.length) {
        stampMask(strokes[progress], true); progress++; moved = true;
      } else if (direction < 0 && progress > 0) {
        progress--; stampMask(strokes[progress], false); moved = true;
      }
    }
    if (moved) composite();
    if ((direction > 0 && progress >= strokes.length) || (direction < 0 && progress <= 0) || !moved) {
      if (direction > 0 && progress >= strokes.length) {
        // ensure mask is fully clear so no painting residue remains
        mctx.clearRect(0, 0, W, H);
        composite();
      } else if (direction < 0 && progress <= 0) {
        // ensure painting is fully restored
        mctx.globalCompositeOperation = "source-over";
        mctx.fillStyle = "#fff";
        mctx.fillRect(0, 0, W, H);
        composite();
      }
      animating = false; return;
    }
    requestAnimationFrame(tick);
  }

  function start(dir) {
    direction = dir;
    if (!animating) { animating = true; requestAnimationFrame(tick); }
    if (dir > 0 && !hintHidden) { hintHidden = true; hint.classList.add("hidden"); }
  }

  wrap.addEventListener("mouseenter", function() { start(1); });
  wrap.addEventListener("mouseleave", function() {
    start(-1);
    setTimeout(function() { if (progress <= 0) { hintHidden = false; hint.classList.remove("hidden"); } }, 500);
  });

  var touchRevealed = false;
  wrap.addEventListener("touchstart", function(e) {
    e.preventDefault();
    touchRevealed = !touchRevealed;
    start(touchRevealed ? 1 : -1);
  }, {passive:false});
})();
